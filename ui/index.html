<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Nebo</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="graphs.css">
<link rel="stylesheet" href="library.css">
</head>
<body>
<section id="library" aria-label="Library"></section>
<main id="editor" hidden>
  <header id="bar">
    <button id="backLib" title="Back to library">‹ Library</button>
    <span class="sep"></span>
    <input id="color" type="hidden" value="#000000">
    <button id="colorBtn" class="colorbtn" type="button" title="Pen colour" aria-haspopup="dialog" aria-expanded="false"></button>
    <input id="width" type="range" min="1" max="12" value="2" title="Pen width">
    <button id="pen" class="on">Pen</button>
    <button id="eraser">Eraser</button>
    <button id="smart" title="Smart shapes: snap lines, arrows, circles, rectangles and triangles (or hold the pen still at the end of a stroke)">Shapes</button>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <button id="prev">‹</button><span id="pageNo">–</span><button id="next">›</button>
    <button id="addPage">+ Page</button>
    <span class="sep"></span>
    <button id="zoomOut" title="Zoom out">−</button><span id="zoomPct" class="muted">100%</span><button id="zoomIn" title="Zoom in">+</button>
    <button id="resetView" title="Reset view">Reset view</button>
    <span class="sep"></span>
    <button id="importPdf" title="Import a PDF into this notebook">Import PDF</button>
    <button id="exportPdf" title="Export this notebook as a PDF">Export PDF</button>
    <span id="status" class="muted"></span>
  </header>
  <div id="banner" hidden></div>
  <div id="stage"><canvas id="cv"></canvas></div>
</main>
<script src="history.js"></script>
<script src="view.js"></script>
<script src="pagerange.js"></script>
<script src="templates.js"></script>
<script src="shapes.js"></script>
<script src="selection-geom.js"></script>
<script src="selection.js"></script> <!-- before app.js: its capturing pointer handlers must win in select mode -->
<script src="images.js"></script>
<script src="colorpicker.js"></script>
<script src="app.js"></script>
<script src="graphs.js"></script>
<script src="pages.js"></script>
<script src="library.js"></script>
<script type="module" src="pdf.js"></script>
</body>
</html>
