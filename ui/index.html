<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Nebo</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="graphs.css">
</head>
<body>
<aside id="side">
  <div class="row"><strong>Notebooks</strong><button id="newBtn" title="New notebook">+</button></div>
  <form id="newForm" hidden><input id="newName" placeholder="Notebook name" autocomplete="off"></form>
  <div id="vaultPath" class="muted"></div>
  <button id="pickVault" class="link">Change folder…</button>
  <button id="stignore" class="link">Create .stignore</button>
  <ul id="list"></ul>
</aside>
<main>
  <header id="bar">
    <input id="color" type="color" value="#000000" title="Pen color">
    <input id="width" type="range" min="1" max="12" value="2" title="Pen width">
    <button id="pen" class="on">Pen</button>
    <button id="eraser">Eraser</button>
    <button id="undo">Undo</button>
    <span class="sep"></span>
    <button id="prev">‹</button><span id="pageNo">–</span><button id="next">›</button>
    <button id="addPage">+ Page</button>
    <span id="status" class="muted"></span>
  </header>
  <div id="banner" hidden></div>
  <div id="stage"><canvas id="cv"></canvas></div>
</main>
<script src="app.js"></script>
<script src="graphs.js"></script>
</body>
</html>
